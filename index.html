<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Story Magic 3D · Rafeeq</title>
  <meta name="description" content="Type or say a story idea and get a brand-new, gentle 3D animated story movie made just for you." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sky" aria-hidden="true">
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div>
  </div>

  <!-- ═════════════ 1. INPUT ═════════════ -->
  <main id="screen-input" class="screen active">
    <header class="hero">
      <div class="logo">📖✨</div>
      <h1>Story Magic <span>3D</span></h1>
      <p>Tell me your idea, and I'll make a cozy 3D movie just for you!</p>
    </header>

    <form id="story-form" class="panel" autocomplete="off">
      <div class="row two">
        <label class="field">
          <span>😊 Your name</span>
          <input id="f-name" maxlength="20" placeholder="Like Khadeja" required />
        </label>
        <label class="field">
          <span>🎂 Age: <b id="age-out">6</b></span>
          <input id="f-age" type="range" min="3" max="12" value="6" />
        </label>
      </div>

      <label class="field">
        <span>💜 Your favorite thing</span>
        <input id="f-fav" maxlength="40" placeholder="Dinosaurs, rainbows, cats, space…" />
      </label>

      <label class="field">
        <span>💭 Your story idea</span>
        <div class="idea-wrap">
          <textarea id="f-idea" rows="3" maxlength="300" placeholder="A bunny who wants to visit the moon…"></textarea>
          <button type="button" id="mic" class="mic" aria-label="Say your idea">🎤</button>
        </div>
        <small id="mic-hint" class="hint"></small>
      </label>

      <div class="chips" id="chips" aria-label="Idea ideas"></div>

      <div class="field">
        <span>🎙️ Pick your storyteller</span>
        <div class="voices" id="voices" role="radiogroup"></div>
      </div>

      <p class="friendly" id="friendly" hidden></p>
      <button id="go" class="big-btn" type="submit">✨ Make My Story! ✨</button>
      <p class="fine" id="account-line"></p>
    </form>
  </main>

  <!-- ═════════════ 2. LOADING ═════════════ -->
  <section id="screen-loading" class="screen" aria-live="polite">
    <div class="panel loading">
      <div class="magic-book" aria-hidden="true">
        <div class="book">📖</div>
        <div class="orbit"><span>⭐</span><span>🌙</span><span>☁️</span></div>
      </div>
      <h2 id="load-title">Making your movie…</h2>
      <div class="bar"><div id="bar-fill"></div></div>
      <p class="eta" id="eta">Getting the magic ready…</p>
      <ul class="steps" id="steps"></ul>
      <div class="scene-chips" id="scene-chips"></div>
      <p class="fun" id="fun-fact"></p>
      <button class="ghost-btn" id="cancel">↩︎ Start over</button>
    </div>
  </section>

  <!-- ═════════════ 3. PLAYER ═════════════ -->
  <section id="screen-player" class="screen">
    <div class="theater">
      <div class="stage" id="stage">
        <div class="layer"></div>
        <div class="layer"></div>
        <div class="captions" id="captions"></div>
        <button class="big-play" id="big-play" aria-label="Play the movie">▶️<span>Play my movie</span></button>
      </div>
      <div class="controls">
        <button id="c-play" aria-label="Play">▶️</button>
        <button id="c-replay" aria-label="Replay">🔁</button>
        <button id="c-music" aria-label="Music on or off">🎵</button>
        <div class="dots" id="dots"></div>
        <button id="c-download" class="pill" aria-label="Download my movie">⬇️ <span>Download my movie</span></button>
        <button id="c-new" class="pill" aria-label="New story">✨ <span>New story</span></button>
      </div>
      <p class="note" id="player-note"></p>
    </div>
  </section>

  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
